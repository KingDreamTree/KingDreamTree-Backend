name: app-deploy

on:
  push:
    branches: [app/develop]
  pull_request:
    branches: [app/develop]

permissions:
  contents: read

jobs:
  api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Test deployment checks
        run: python -m unittest discover -s tests -p test_api_docs.py
      - name: Verify Swagger and export OpenAPI without external services
        env:
          PHOTO_PIPELINE: storage
          BUILD_REVISION: ${{ github.sha }}
        run: python scripts/check_api_docs.py --output openapi.json --expected-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openapi-${{ github.sha }}
          path: openapi.json
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: api-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/app/develop'
    # 기존 deploy 워크플로와 같은 서버를 사용하므로 같은 잠금을 사용한다.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and deploy the checked commit on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA
          timeout: 30s
          command_timeout: 25m
          script: |
            set -eu
            cd ~/KingDreamTree-Backend
            git fetch origin app/develop
            if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
              echo 'A newer app/develop commit exists; use its deployment run.'
              exit 1
            fi
            # 배포 전용 체크아웃. .env 등 추적하지 않는 서버 설정은 유지된다.
            # 실행을 시작한 커밋을 배포해야 새 push와 섞이지 않는다.
            git checkout --detach --force "$DEPLOY_SHA"
            docker compose build --build-arg BUILD_REVISION="$DEPLOY_SHA"
            docker compose up -d --no-build --force-recreate api worker
            docker compose up -d --no-build caddy
            docker image prune -f

      - name: Verify live API, Swagger, OpenAPI and deployed revision
        run: >-
          python3 scripts/check_api_docs.py
          --base-url https://api.refit.live
          --expected-revision "$GITHUB_SHA"
          --attempts 12 --delay 10
      - name: Publish developer links
        run: |
          {
            echo '### App development API deployed'
            echo "Commit: $GITHUB_SHA"
            echo '- Swagger: https://api.refit.live/docs'
            echo '- OpenAPI: https://api.refit.live/openapi.json'
            echo '- API base: https://api.refit.live/api/v1'
          } >> "$GITHUB_STEP_SUMMARY"
