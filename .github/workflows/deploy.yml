# CI 자동 배포 — main 에 머지되면 EC2 가 최신 코드로 갱신된다.
#
# 방식: GitHub Actions 러너가 EC2 에 SSH 로 들어가 pull + 재빌드.
#   ⚠️ ECR 을 쓰지 않는다 — 서버 1대 + EC2 직접 빌드 구조라 레지스트리가
#      필요 없다 (docs 및 Dockerfile 주석 참고). 서버가 늘면 그때 전환.
#
# 필요한 리포 Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     서버 탄력적 IP
#   EC2_SSH_KEY  refit-ec2.pem 파일 내용 전체 (-----BEGIN ... END----- 포함)
#
# ⚠️ 이 워크플로를 수정할 수 있는 사람 = 사실상 서버에 명령을 넣을 수 있는
#    사람이다. 리포 쓰기 권한 관리가 곧 서버 접근 관리다 (지금은 팀 2명이라 OK).

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

# 배포가 겹치면 안 된다 — 앞선 배포가 끝날 때까지 뒤 배포는 대기.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2 에서 pull + 재빌드
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/KingDreamTree-Backend
            git fetch origin
            git checkout main
            # ⚠️ pull --ff-only 가 아니라 reset --hard 다. 배포 서버는 origin 을
            #    **그대로 반영**하는 곳이지 머지하는 곳이 아니다. ff-only 로 두면
            #    main 히스토리가 재작성되는 순간(2026-08-16 실제로 발생) 공통 조상이
            #    없어져 pull 이 실패하고, set -e 때문에 배포가 통째로 멈춘다.
            #    그때 서버에 SSH 로 들어가 손으로 고쳐야 하는데, 키가 없는 사람은
            #    배포를 못 되살린다.
            # ⚠️ 추적되는 파일만 되돌린다 — .env 는 .gitignore 라 그대로 남는다.
            git reset --hard origin/main
            # 무중단 배포 — 이미지 한 번 빌드 → api_a → api_b → worker 순서로 교체.
            #   (`docker compose up -d --build` 는 API 를 통째로 재시작해 몇 초 끊긴다)
            #   옛 이미지 정리(image prune)도 스크립트 안에서 한다.
            bash scripts/deploy_rolling.sh

      - name: 배포 결과 확인 (헬스 체크)
        run: |
          sleep 5
          curl -fsS https://api.refit.live/health
          echo "OK"
