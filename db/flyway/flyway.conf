# Credentials come from local .env.flyway through scripts/database.py; never deploy them.
flyway.locations=filesystem:/flyway/sql
flyway.defaultSchema=refit_migrations
flyway.schemas=refit_migrations,public
flyway.table=flyway_schema_history
flyway.baselineVersion=1
flyway.baselineDescription=Web-only snapshot before app database changes
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true
flyway.placeholderReplacement=false
flyway.connectRetries=3
