# EC2 배포 구성 — 컨테이너 4개.
#
#   caddy    80/443 수신. HTTPS 인증서를 Let's Encrypt 에서 **자동 발급·갱신**하고
#            api_a / api_b 중 **살아 있는 쪽**으로 프록시한다. (도메인은 Caddyfile 에서 설정)
#   api_a    FastAPI. 내부 8000 — 보안그룹에서도, 여기서도 밖에 직접 열지 않는다.
#   api_b    같은 이미지의 두 번째 API. 무중단 배포용 — 하나를 갈아끼우는 동안 다른 하나가 받는다.
#   worker   LLM 잡 워커 (OCR·VLM·루틴). 세그멘테이션 워커는 RunPod — 여기 없다.
#
# 실행(처음):  docker compose up -d --build
# 배포(무중단): scripts/deploy_rolling.sh   ← 이미지 한 번 빌드 → api_a → api_b → worker 순서로 교체.
#              deploy.yml 이 이걸 부른다. `docker compose up -d --build` 로 한꺼번에 올리면
#              두 API 가 동시에 재시작되어 몇 초 끊긴다 — 무중단이 필요하면 스크립트로.
# 로그:  docker compose logs -f api_a        (또는 api_b / worker / caddy)
#
# ⚠️ 같은 폴더에 .env 가 있어야 뜬다 (Supabase·OpenAI 키). 리포에는 없으므로
#    서버에서 직접 만든다 — .env.example 참고.
# ⚠️ api_a 만 build: 를 갖고 api_b 는 그 이미지(image:)를 그대로 쓴다. 둘 다 build: 를
#    두면 같은 걸 두 번 빌드한다.

x-api: &api
  image: kingdreamtree-backend-api:latest
  restart: unless-stopped
  env_file: .env
  stop_grace_period: 120s
  # 컨테이너 안에서 /health 가 200 이면 healthy. `docker compose up -d --wait` 가 이걸 기다린다.
  # (slim 이미지에 curl 이 없어 python 으로 본다)
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
    interval: 5s
    timeout: 5s
    retries: 6
    start_period: 10s

services:
  api_a:
    <<: *api
    build: .

  api_b:
    <<: *api

  worker:
    image: kingdreamtree-backend-api:latest
    # ⚠️ 사진 경로가 팟(PHOTO_PIPELINE=pod)으로 바뀌면 .env 에
    #      WORKER_KINDS=OCR_INBODY,ROUTINE_GEN,ROUTINE_PATCH
    #    를 두어 VLM_PART/VLM_OVERALL 을 **여기서 빼야 한다.** 그 잡은 팟이 자기 안에서
    #    처리하고, 사진이 팟 메모리에만 있어 이 워커가 집으면 실패한다.
    #    값이 없으면 종전 구성(사진을 Storage 에서 읽는 경로) 그대로다.
    command: python -m app.worker.run --kinds ${WORKER_KINDS:-OCR_INBODY,VLM_PART,VLM_OVERALL,ROUTINE_GEN,ROUTINE_PATCH}
    restart: unless-stopped
    env_file: .env
    # ⚠️ run.py 의 graceful stop(_handle_signal)은 **현재 잡이 끝나야** 루프를
    #    빠져나간다. compose 기본 유예는 10초라 VLM 잡(30~90초)이 매 배포마다
    #    SIGKILL 된다 → 그 잡은 PROCESSING 에 15분 갇혔다 회수되고, 회수되면
    #    Vision 호출이 한 번 더 나간다. 코드는 이미 있고 유예만 없었다.
    stop_grace_period: 120s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서 보관소 — 지우면 재발급하느라 Let's Encrypt 발급 한도를 깎아먹는다
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
